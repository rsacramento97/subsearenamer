[package]
name = "subsea-renamer-core"
version = "0.2.0"
edition = "2021"
description = "Safe copy, verify and rename engine for SubSeaRenamer"

[dependencies]
sha2 = "0.10"
hex = "0.4"
walkdir = "2.5"
thiserror = "2"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
